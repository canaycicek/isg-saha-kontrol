<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <meta name="theme-color" content="#1a1a2e">
  <title>İSG Saha Kontrol - Kayıt Sistemi</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="styles.css">

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
  <div class="container">
    <!-- Header -->
    <header class="app-header">
      <div>
        <h1><img src="logo.jpg"
            style="height: 60px; width: auto; vertical-align: middle; margin-right: 12px; border-radius: 8px;"> İSG Saha
          Kontrol</h1>
        <p class="subtitle">Saha Gözlem Kayıt Sistemi</p>
      </div>
      <div class="user-profile" id="userProfile">
        <span class="user-name" id="userName"></span>
        <span class="user-role" id="userRole"></span>
        <button class="btn btn-secondary btn-small" id="logoutBtn">🚪 Çıkış</button>
      </div>
    </header>

    <!-- Camera Section (Only for Admin) -->
    <section class="camera-section" id="cameraSection" style="display: none;">
      <div class="camera-container">
        <video id="cameraPreview" autoplay playsinline></video>
        <canvas id="photoCanvas" style="display: none;"></canvas>
        <img id="capturedPhoto" style="display: none;" alt="Çekilen Fotoğraf">
      </div>

      <div class="camera-controls">
        <button id="startCameraBtn" class="btn btn-primary">
          📷 Kamerayı Aç
        </button>
        <button id="captureBtn" class="btn btn-success" style="display: none;">
          📸 Fotoğraf Çek
        </button>
        <button id="retakeBtn" class="btn btn-warning" style="display: none;">
          🔄 Yeniden Çek
        </button>
      </div>

      <!-- AI Analysis Loading -->
      <div class="ai-loading" id="aiLoading" style="display: none;">
        <div class="ai-spinner"></div>
        <p>🤖 Yapay zeka fotoğrafı analiz ediyor...</p>
        <small>Bu işlem 5-10 saniye sürebilir</small>
      </div>
    </section>

    <!-- Form Section -->
    <section class="form-section" id="formSection" style="display: none;">
      <h2>📝 Kontrol Kaydı</h2>
      <form id="inspectionForm">
        <div class="form-group">
          <label for="kontrolTarihi">Kontrol Tarihi:</label>
          <input type="date" id="kontrolTarihi" name="kontrolTarihi" required>
        </div>

        <div class="form-group">
          <label for="maddeNo">Madde No:</label>
          <input type="text" id="maddeNo" name="maddeNo" readonly>
          <small class="helper-text">Otomatik oluşturulur</small>
        </div>

        <div class="form-group">
          <label for="bulgular">Bulgular:</label>
          <textarea id="bulgular" name="bulgular" required placeholder="Tespit edilen bulgular..."></textarea>
        </div>

        <div class="form-group">
          <label for="alinmasiGerekenAksiyon">Alınması Gereken Aksiyon:</label>
          <textarea id="alinmasiGerekenAksiyon" name="alinmasiGerekenAksiyon" required
            placeholder="Gerekli aksiyonlar..."></textarea>
        </div>

        <div class="form-group">
          <label for="alinanAksiyon">Alınan Aksiyon:</label>
          <textarea id="alinanAksiyon" name="alinanAksiyon"
            placeholder="Gerçekleştirilen aksiyonlar (opsiyonel)..."></textarea>
        </div>

        <div class="form-group">
          <label for="terminTarihi">Termin Tarihi:</label>
          <input type="date" id="terminTarihi" name="terminTarihi" required>
        </div>

        <div class="form-group">
          <label for="durum">Durum:</label>
          <select id="durum" name="durum" required>
            <option value="Tamamlanmadı">Tamamlanmadı</option>
            <option value="Tamamlandı">Tamamlandı</option>
          </select>
        </div>

        <div class="form-actions">
          <button type="button" class="btn btn-secondary" id="cancelBtn">❌ İptal</button>
          <button type="submit" class="btn btn-success">💾 Kaydet</button>
        </div>
      </form>
    </section>

    <!-- Records Section -->
    <section class="records-section">
      <div class="records-header">
        <h2>📊 Kayıtlar (<span id="recordCount">0</span>)</h2>
        <button id="exportBtn" class="btn btn-primary">
          📥 Excel İndir
        </button>
      </div>

      <div id="recordsList" class="records-list">
        <p class="empty-state">Henüz kayıt yok. Fotoğraf çekerek başlayın.</p>
      </div>
    </section>
  </div>

  <!-- Firebase SDK (Compat Version) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>

  <!-- AI Photo Analyzer -->
  <script type="module" src="ai-analyzer.js"></script>

  <!-- Excel Export Library -->
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.3.0/dist/exceljs.min.js"></script>

  <!-- Firebase Authentication -->
  <script src="auth-firebase.js"></script>

  <script type="module">
    // Firebase Configuration (from environment variables)
    const firebaseConfig = {
      apiKey: import.meta.env.VITE_FIREBASE_API_KEY,
      authDomain: import.meta.env.VITE_FIREBASE_AUTH_DOMAIN,
      projectId: import.meta.env.VITE_FIREBASE_PROJECT_ID,
      storageBucket: import.meta.env.VITE_FIREBASE_STORAGE_BUCKET,
      messagingSenderId: import.meta.env.VITE_FIREBASE_MESSAGING_SENDER_ID,
      appId: import.meta.env.VITE_FIREBASE_APP_ID
    };

    // Initialize Firebase (if not already initialized)
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    // Initialize Auth Manager
    const authManager = new FirebaseAuthManager();

    // Make it global for app.js
    window.authManager = authManager;

    // Make Storage globally available
    window.storage = firebase.storage();
  </script>

  <!-- Main App -->
  <script type="module" src="app.js"></script>
</body>

</html>
